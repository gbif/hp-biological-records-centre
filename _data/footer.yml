# Footer configuration
# You should create one of these files for each language you support. E.g. /_data/es/footer.yml for the spanish version of the footer
# Footer content is organized in columns.
# You can also add a small print license statement at the bottom.

# Columns (the more you add, the narrower they will be)
columns:
  - name: About
    description: | # Can be Markdown and multiline as shown here. 
      The Biological Records Centre is part of the UK Centre for Ecology & Hydrology. For further information see the following websites:
    links:
    - text: Biological Records Centre
      href: https://www.brc.ac.uk/
    - text: UK Centre for Ecology & Hydrology
      href: https://www.ceh.ac.uk/

  - name: Code
    description: | # Can be Markdown
      This project is open source.
      The files are available on [GitHub](https://github.com/gbif/hp-biological-records-centre).
  
  - name: Contact
    description: | # Can be Markdown
      **Biological Records Centre**
      **UK Centre for Ecology & Hydrology**
      * Maclean Building
      * Benson Lane, Crowmarsh Gifford
      * Wallingford
      * United Kingdom
    connectIcons: true # Show social icons (defined in _config.yml)


  # EXAMPLE - just leave this commented out at the bottom of the file for future reference
  # You can add as many columns as you want

